name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs first: a leaked credential should fail the build before anything
      # else spends time, and before a log could echo it.
      - name: Scan for committed secrets
        run: npm run scan:secrets

      - name: Typecheck
        run: npm run typecheck

      # Fails on any error: the config's max-lines / complexity gates are what
      # keep src/ reviewable, so an exception needs a PR, not a quiet file.
      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Unit tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high
